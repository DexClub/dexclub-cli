name: Build Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      native_target:
        description: "仅构建指定 DexKit native 目标；留空时构建全部"
        required: false
        type: choice
        default: all
        options:
          - all
          - linux-x64
          - linux-arm64
          - android-arm64
          - windows-x64
          - macos-x64
          - macos-arm64

permissions:
  contents: write

concurrency:
  group: build-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-native:
    name: build-native
    uses: ./.github/workflows/build-native.yml
    with:
      native_target: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.native_target || 'all' }}

  build-cli:
    needs: build-native
    name: build-cli
    uses: ./.github/workflows/build-cli.yml
    with:
      native_target: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.native_target || 'all' }}
      release_version: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      release_commit: ${{ github.sha }}
      release_dirty: false

  build-mcp:
    needs: build-native
    name: build-mcp
    uses: ./.github/workflows/build-mcp.yml
    with:
      native_target: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.native_target || 'all' }}
      release_version: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
      release_commit: ${{ github.sha }}
      release_dirty: false

  verify-package-metadata:
    needs:
      - build-cli
      - build-mcp
    name: verify-package-metadata
    runs-on: ubuntu-24.04

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dexclub*
          path: package-artifacts

      - name: Compare generated metadata
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -Path package-artifacts -Recurse -Filter '*.zip' -File | Sort-Object FullName)
          if ($archives.Count -eq 0) {
            throw "No package archives were collected."
          }

          $metadata = @()
          for ($index = 0; $index -lt $archives.Count; $index++) {
            $archive = $archives[$index]
            $extractDir = Join-Path $PWD ".ci/verify/$index"
            New-Item -ItemType Directory -Force -Path $extractDir | Out-Null
            Expand-Archive -Path $archive.FullName -DestinationPath $extractDir -Force

            $versionFile = Get-ChildItem -Path $extractDir -Recurse -Filter VERSION -File
            if ($versionFile.Count -ne 1) {
              throw "Expected exactly one VERSION in $($archive.Name), found $($versionFile.Count)."
            }
            $metadata += (Get-Content -Raw $versionFile[0].FullName).Trim()

            if ($archive.Name -like 'dexclub-mcp-*') {
              $skillFile = Get-ChildItem -Path $extractDir -Recurse -Filter SKILL.md -File |
                Where-Object { $_.FullName -match 'dexclub-analysis' }
              if ($skillFile.Count -ne 1) {
                throw "Expected one generated dexclub-analysis skill in $($archive.Name)."
              }
              if (Select-String -Path $skillFile[0].FullName -Pattern '__DEXCLUB_(VERSION|MCP_CONTRACT_VERSION)__' -Quiet) {
                throw "Unresolved skill version placeholder in $($archive.Name)."
              }
            }
          }

          if (@($metadata | Sort-Object -Unique).Count -ne 1) {
            throw "CLI and MCP package metadata differ."
          }

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-cli
      - build-mcp
      - verify-package-metadata
    name: release
    runs-on: ubuntu-24.04

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dexclub*
          path: release-artifacts

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "${{ github.ref_name }}"
          $isPrerelease = $tag -match '(preview|beta|rc)'
          $assets = Get-ChildItem -Path release-artifacts -Recurse -File |
            Where-Object { $_.Extension -in @('.zip', '.sha256') } |
            Sort-Object FullName

          if ($assets.Count -eq 0) {
            throw "No release assets were collected."
          }

          $assetPaths = $assets | ForEach-Object { $_.FullName }
          if (gh release view $tag *> $null) {
            gh release upload $tag @assetPaths --clobber
          } else {
            try {
              if ($isPrerelease) {
                gh release create $tag @assetPaths --verify-tag --generate-notes --prerelease
              } else {
                gh release create $tag @assetPaths --verify-tag --generate-notes
              }
            } catch {
              gh release upload $tag @assetPaths --clobber
            }
          }
